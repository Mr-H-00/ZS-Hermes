<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Yuxi system architecture overview</title>
  <desc id="desc">A layered overview of Yuxi clients, API and worker execution, durable storage, knowledge services, and sandbox runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#52616b"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 16px Arial, sans-serif; fill: #52616b; }
      .group { fill: #f7f9fb; stroke: #b9c5cf; stroke-width: 1.5; }
      .group-title { font: 700 17px Arial, sans-serif; fill: #33414d; }
      .node { fill: #fff; stroke: #71808c; stroke-width: 1.5; }
      .app { fill: #e8f4ff; stroke: #3979ad; }
      .data { fill: #eef8ed; stroke: #4d8d5d; }
      .queue { fill: #fff4df; stroke: #b7791f; }
      .knowledge { fill: #f6edff; stroke: #8057a0; }
      .sandbox { fill: #fff0f1; stroke: #b85262; }
      .node-title { font: 700 16px Arial, sans-serif; fill: #17212b; }
      .node-text { font: 13px Arial, sans-serif; fill: #43515e; }
      .line { fill: none; stroke: #52616b; stroke-width: 1.7; marker-end: url(#arrow); }
      .line-label { font: 12px Arial, sans-serif; fill: #3f4e5a; }
    </style>
  </defs>
  <rect width="1400" height="1040" fill="#ffffff"/>
  <text x="50" y="54" class="title">Yuxi 系统架构总览</text>
  <text x="50" y="82" class="subtitle">Compose 拓扑、事实 Owner 与关键数据边界</text>

  <rect x="48" y="110" width="1304" height="124" rx="8" class="group"/>
  <text x="68" y="140" class="group-title">用户入口</text>
  <rect x="96" y="161" width="190" height="48" rx="6" class="node"/>
  <text x="191" y="182" text-anchor="middle" class="node-title">用户 / 外部客户端</text>
  <text x="191" y="200" text-anchor="middle" class="node-text">浏览器、管理端、HTTP 调用方</text>
  <rect x="432" y="161" width="210" height="48" rx="6" class="node app"/>
  <text x="537" y="182" text-anchor="middle" class="node-title">web</text>
  <text x="537" y="200" text-anchor="middle" class="node-text">Vue 3 + Vite + Pinia</text>
  <rect x="794" y="161" width="220" height="48" rx="6" class="node app"/>
  <text x="904" y="182" text-anchor="middle" class="node-title">api</text>
  <text x="904" y="200" text-anchor="middle" class="node-text">FastAPI / HTTP / SSE</text>
  <path d="M286 185 H432" class="line"/>
  <path d="M642 185 H794" class="line"/>
  <text x="680" y="175" class="line-label">/api + SSE</text>

  <rect x="48" y="270" width="1304" height="238" rx="8" class="group"/>
  <text x="68" y="300" class="group-title">Yuxi 应用运行层</text>
  <rect x="85" y="329" width="190" height="66" rx="6" class="node app"/>
  <text x="180" y="351" text-anchor="middle" class="node-title">routers</text>
  <text x="180" y="371" text-anchor="middle" class="node-text">认证、输入校验、响应装配</text>
  <rect x="315" y="329" width="210" height="66" rx="6" class="node app"/>
  <text x="420" y="351" text-anchor="middle" class="node-title">yuxi.services</text>
  <text x="420" y="371" text-anchor="middle" class="node-text">用例、事务、运行编排</text>
  <rect x="565" y="329" width="210" height="66" rx="6" class="node app"/>
  <text x="670" y="351" text-anchor="middle" class="node-title">repositories</text>
  <text x="670" y="371" text-anchor="middle" class="node-text">可见性查询、PostgreSQL 持久化</text>
  <rect x="815" y="329" width="210" height="66" rx="6" class="node app"/>
  <text x="920" y="351" text-anchor="middle" class="node-title">Agent Runtime</text>
  <text x="920" y="371" text-anchor="middle" class="node-text">LangGraph / middleware / tools</text>
  <rect x="1065" y="329" width="230" height="66" rx="6" class="node app"/>
  <text x="1180" y="351" text-anchor="middle" class="node-title">worker</text>
  <text x="1180" y="371" text-anchor="middle" class="node-text">ARQ / AgentRun / Durable Task</text>
  <rect x="315" y="422" width="210" height="54" rx="6" class="node app"/>
  <text x="420" y="444" text-anchor="middle" class="node-title">storage-migrator</text>
  <text x="420" y="462" text-anchor="middle" class="node-text">唯一 Schema 修改者</text>
  <rect x="815" y="422" width="210" height="54" rx="6" class="node app"/>
  <text x="920" y="444" text-anchor="middle" class="node-title">共享 / 内置 Skills</text>
  <text x="920" y="462" text-anchor="middle" class="node-text">按用户生成只读 projection</text>
  <path d="M904 209 V329" class="line"/>
  <path d="M904 287 H275" class="line"/>
  <path d="M275 362 H315" class="line"/>
  <path d="M525 362 H565" class="line"/>
  <path d="M525 381 H815" class="line"/>
  <path d="M1025 362 H1065" class="line"/>

  <rect x="48" y="544" width="578" height="296" rx="8" class="group"/>
  <text x="68" y="574" class="group-title">最终事实与持久文件</text>
  <rect x="80" y="608" width="244" height="92" rx="6" class="node data"/>
  <text x="202" y="632" text-anchor="middle" class="node-title">PostgreSQL</text>
  <text x="202" y="653" text-anchor="middle" class="node-text">Message / Request / Run / Task</text>
  <text x="202" y="672" text-anchor="middle" class="node-text">权限、知识元数据、checkpoint</text>
  <rect x="352" y="608" width="244" height="92" rx="6" class="node data"/>
  <text x="474" y="632" text-anchor="middle" class="node-title">UserWorkspace</text>
  <text x="474" y="653" text-anchor="middle" class="node-text">Project Workdir / Artifact</text>
  <text x="474" y="672" text-anchor="middle" class="node-text">个人 Skill、持久文件字节</text>
  <rect x="80" y="728" width="244" height="82" rx="6" class="node data"/>
  <text x="202" y="752" text-anchor="middle" class="node-title">MinIO</text>
  <text x="202" y="773" text-anchor="middle" class="node-text">知识库原文件、解析对象、临时上传</text>
  <path d="M670 395 V608 H324" class="line"/>
  <path d="M920 395 V608 H596" class="line"/>
  <path d="M420 476 V608" class="line"/>
  <text x="432" y="548" class="line-label">Schema migration</text>

  <rect x="660" y="544" width="692" height="296" rx="8" class="group"/>
  <text x="680" y="574" class="group-title">投递、知识与隔离运行时</text>
  <rect x="692" y="608" width="180" height="82" rx="6" class="node queue"/>
  <text x="782" y="632" text-anchor="middle" class="node-title">Redis / ARQ</text>
  <text x="782" y="653" text-anchor="middle" class="node-text">投递、Stream、取消、缓存</text>
  <text x="782" y="672" text-anchor="middle" class="node-text">不拥有业务终态</text>
  <rect x="904" y="608" width="190" height="82" rx="6" class="node knowledge"/>
  <text x="999" y="632" text-anchor="middle" class="node-title">Milvus + etcd</text>
  <text x="999" y="653" text-anchor="middle" class="node-text">向量、BM25、混合检索</text>
  <text x="999" y="672" text-anchor="middle" class="node-text">可重建检索投影</text>
  <rect x="1126" y="608" width="190" height="82" rx="6" class="node knowledge"/>
  <text x="1221" y="632" text-anchor="middle" class="node-title">Neo4j</text>
  <text x="1221" y="653" text-anchor="middle" class="node-text">可选实体与关系投影</text>
  <text x="1221" y="672" text-anchor="middle" class="node-text">图谱任务独立执行</text>
  <rect x="904" y="728" width="190" height="82" rx="6" class="node sandbox"/>
  <text x="999" y="752" text-anchor="middle" class="node-title">sandbox-provisioner</text>
  <text x="999" y="773" text-anchor="middle" class="node-text">identity / proxy / lifecycle</text>
  <rect x="1126" y="728" width="190" height="82" rx="6" class="node sandbox"/>
  <text x="1221" y="752" text-anchor="middle" class="node-title">动态 Runtime</text>
  <text x="1221" y="773" text-anchor="middle" class="node-text">user-data rw / skills ro</text>
  <path d="M904 395 V649 H872" class="line"/>
  <path d="M1180 395 V608 H872" class="line"/>
  <path d="M1180 395 V728 H1094" class="line"/>
  <path d="M1094 769 H1126" class="line"/>
  <path d="M920 476 V728" class="line"/>
  <path d="M999 690 V728" class="line"/>
  <path d="M1221 690 V728" class="line"/>
  <path d="M904 690 V728 H324" class="line"/>
  <text x="488" y="718" class="line-label">知识工具校验后读写对象 / 投影</text>

  <rect x="48" y="874" width="1304" height="112" rx="8" fill="#f2f7fb" stroke="#b9c5cf" stroke-width="1.5"/>
  <text x="68" y="906" class="group-title">运行边界</text>
  <text x="68" y="936" class="node-text">完整模式装配知识库、评估、图谱和知识 Durable Task。LITE_MODE 保留 AgentRun、Workspace、MCP、非知识 Skills 与系统管理，但不导入知识解析重运行时、不注册知识路由或知识工具。</text>
  <text x="68" y="963" class="node-text">/api/system/health 表示进程存活；/api/system/ready 表示接流量前置条件。业务正确性仍由真实 HTTP、worker、数据库和外部存储链路验证。</text>
</svg>
